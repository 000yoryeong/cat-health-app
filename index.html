<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="냥이건강">
<meta name="theme-color" content="#0f0f1a">
<title>태산이와 또팔이</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* CSS 스타일은 썸머님의 기존 디자인과 동일하게 유지합니다. */
:root {
  --bg:#0f0f1a; --bg2:#1a1a2e; --bg3:#22223a;
  --card:#1e1e32; --card2:#252540;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.14);
  --text:#f0eff8; --text2:#a09ec0; --text3:#6b6990;
  --a:#b48be4; --a-s:rgba(180,139,228,.15); --a-d:rgba(180,139,228,.08);
  --b:#5ecfb0; --b-s:rgba(94,207,176,.15);  --b-d:rgba(94,207,176,.08);
  --ok:#5ecfb0; --ok-bg:rgba(94,207,176,.12);
  --warn:#f4a94a; --warn-bg:rgba(244,169,74,.12);
  --bad:#f07070; --bad-bg:rgba(240,112,112,.12);
  --r:16px; --rs:10px; --tab-h:64px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;font-size:15px}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(var(--tab-h) + var(--safe) + 8px)}
.screen{display:none}.screen.active{display:block}
.topbar{padding:54px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.topbar h1{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;letter-spacing:-.3px}
.top-btns{display:flex;align-items:center;gap:12px}
.refresh-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;padding:4px 8px;display:flex;align-items:center;justify-content:center}
.date-badge{font-size:12px;color:var(--text3);background:var(--bg3);padding:5px 12px;border-radius:20px;border:.5px solid var(--border)}
.cat-row{display:flex;gap:10px;padding:0 16px 14px}
.cat-tab{flex:1;padding:12px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s;-webkit-user-select:none}
.cat-tab.aa{border-color:var(--a);background:var(--a-d)}
.cat-tab.bb{border-color:var(--b);background:var(--b-d)}
.cat-emoji{font-size:24px;line-height:1}
.cat-info{min-width:0}
.cat-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-sub{font-size:11px;color:var(--text3);margin-top:1px}
.cat-dot{width:7px;height:7px;border-radius:50%;margin-left:auto;flex-shrink:0}
.da{background:var(--a)}.db{background:var(--b)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px;margin-bottom:14px}
.sc{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:14px}
.sl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sv{font-size:22px;font-weight:500;line-height:1.1}
.su{font-size:13px;color:var(--text3)}
.ss{font-size:11px;color:var(--text3);margin-top:4px}
.chart-card{margin:0 16px 14px;background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:16px}
.chart-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.bars{display:flex;align-items:flex-end;gap:5px;height:60px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height .4s ease}
.ba{background:var(--a);opacity:.8}.bb2{background:var(--b);opacity:.8}
.bar-date{font-size:10px;color:var(--text3)}
.log-btn{margin:0 16px 20px;width:calc(100% - 32px);padding:16px;border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s;letter-spacing:-.2px}
.log-btn:active{opacity:.85;transform:scale(.98)}
.lba{background:var(--a);color:#1a0f2e}.lbb{background:var(--b);color:#0a1e18}
.form-body{padding:0 16px 8px}
.fg{margin-bottom:16px}
.fl{font-size:13px;color:var(--text2);margin-bottom:7px;display:block}
.fi{width:100%;padding:12px 14px;border:1px solid var(--border2);border-radius:var(--rs);background:var(--card);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:15px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus{border-color:var(--a)}
textarea.fi{resize:none;line-height:1.6}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 16px;border:1px solid var(--border2);border-radius:24px;font-size:13px;cursor:pointer;color:var(--text2);background:var(--card);transition:all .15s;-webkit-user-select:none}
.chip:active{transform:scale(.96)}
.chip.sa{background:var(--a-s);color:var(--a);border-color:var(--a)}
.chip.sb{background:var(--b-s);color:var(--b);border-color:var(--b)}
.save-btn{width:100%;padding:15px;border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:6px}
.save-btn:active{opacity:.85;transform:scale(.98)}
.sba{background:var(--a);color:#1a0f2e}.sbb{background:var(--b);color:#0a1e18}
.sec-hdr-btn{font-size:12px;color:var(--text);background:var(--bg3);border:1px solid var(--border);cursor:pointer;padding:6px 12px; border-radius: 8px;}
.filter-row{display:flex;gap:7px;padding:0 16px 12px;overflow-x:auto}
.filter-row::-webkit-scrollbar{display:none}
.fchip{padding:7px 14px;border:1px solid var(--border);border-radius:24px;font-size:12px;cursor:pointer;color:var(--text3);background:var(--card);transition:all .15s;white-space:nowrap;flex-shrink:0}
.fchip.fa{background:var(--a-s);color:var(--a);border-color:var(--a)}
.fchip.fb{background:var(--b-s);color:var(--b);border-color:var(--b)}
.fchip.fall{background:var(--bg3);color:var(--text2);border-color:var(--border2)}
.date-group { margin-bottom: 24px; }
.date-group-header { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 16px 12px; padding-bottom: 6px; border-bottom: 1.5px solid var(--bg3); display: flex; align-items: center; gap: 8px; }
.hist-list{padding:0 16px}
.hist-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:16px;margin-bottom:10px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hist-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hist-tag{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.tga{background:var(--a-s);color:var(--a)}.tgb{background:var(--b-s);color:var(--b)}
.hrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:.5px solid var(--border)}
.hrow:last-of-type{border-bottom:none}
.hk{font-size:13px;color:var(--text3)}.hv{font-size:13px;font-weight:500}
.pbadge{padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}
.memo-box{margin-top:10px;font-size:12px;color:var(--text2);background:var(--bg3);padding:10px 12px;border-radius:8px;border-left:2px solid var(--border2)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;cursor:pointer;border:.5px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg3);font-size:10px;color:var(--text3);text-align:center;}
.empty-state{text-align:center;padding:48px 20px;color:var(--text3);font-size:14px}
.vet-list{padding:0 16px}
.vet-item{background:var(--card);border-radius:var(--r);border:.5px solid var(--border);padding:16px;margin-bottom:10px}
.vet-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.vet-name{font-size:15px;font-weight:500}
.vet-who{font-size:12px;color:var(--text3);margin-top:2px}
.vet-place{font-size:12px;color:var(--text3)}
.vet-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;margin-top:10px;display:inline-block}
.vba{background:var(--a-s);color:var(--a)}.vbb{background:var(--b-s);color:var(--b)}.vbp{background:var(--bg3);color:var(--text3)}
.add-btn{width:100%;padding:14px;border-radius:var(--r);border:1px dashed var(--border2);background:transparent;color:var(--text3);font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;margin:4px 0 20px;transition:all .15s}
.add-btn:active{background:var(--card)}
.panel{display:none;background:var(--card2);border-radius:var(--r);border:.5px solid var(--border2);padding:16px;margin:0 16px 16px;animation:fadeUp .2s ease}
.panel.open{display:block}
.panel-title{font-size:14px;font-weight:500;margin-bottom:14px;color:var(--text2)}
.btn-row{display:flex;gap:8px}
.btn-cancel{flex:0 0 80px;background:var(--bg3);color:var(--text2);border:none;border-radius:var(--r);font-family:'Noto Sans KR',sans-serif;font-size:14px;cursor:pointer;padding:13px}
.photo-upload-area{border:1px dashed var(--border2);border-radius:var(--rs);padding:16px;text-align:center;cursor:pointer;color:var(--text3);font-size:13px;background:var(--card);position:relative;overflow:hidden}
.photo-upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size
